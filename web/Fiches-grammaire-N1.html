<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fiches grammaire N1</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link rel="stylesheet" href="app/style.css">
<link rel="icon" href="app/icone.svg">
<style>
  main { max-width: 860px; }
  .toolbar { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 18px; }
  table.recap { width: 100%; border-collapse: collapse; font-size: .9rem; background: var(--paper); }
  table.recap td, table.recap th { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
  table.recap td.jp { font-size: 1.05rem; white-space: nowrap; }
  .cathead { margin: 34px 0 10px; padding-bottom: 6px; border-bottom: 2px solid var(--accent); }
  .glesson { margin-bottom: 16px; break-inside: avoid; }
  @media print {
    :root { --bg: #fff; --paper: #fff; }
    .toolbar { display: none; }
    body { font-size: 12px; }
    .glesson { box-shadow: none; border: 1px solid #ccc; padding: 12px 16px; }
    .g-pattern { font-size: 1.5rem; }
    .icon-btn { display: none; }
    .recap-wrap { break-after: page; }
    .cathead { break-before: page; }
  }
</style>
</head>
<body>
<main>
  <div class="toolbar"><h1>文法 N1 · Fiches de grammaire</h1><button class="btn primary" id="print">Imprimer / PDF</button></div>
  <div id="out"></div>
</main>
<script src="data/n1-grammaire.js"></script>
<script src="app/fiches.js"></script>
</body>
</html>

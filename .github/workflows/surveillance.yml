name: Surveillance (site et API)

# Toutes les 30 minutes : le site répond, l’API et le stockage sont en bonne santé.
# En cas d’échec, GitHub envoie un e-mail (notification d’échec des workflows planifiés).
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Page d’accueil (jlpt.simondepussay.com)
        run: curl -fsS --retry 3 --retry-delay 10 -o /dev/null -w "accueil %{http_code} en %{time_total}s\n" https://jlpt.simondepussay.com/
      - name: Certificat HTTPS valable encore au moins 14 jours
        run: |
          END=$(echo | openssl s_client -connect jlpt.simondepussay.com:443 -servername jlpt.simondepussay.com 2>/dev/null | openssl x509 -noout -enddate | cut -d= -f2)
          echo "expire le $END"
          [ $(( $(date -d "$END" +%s) - $(date +%s) )) -gt $((14*86400)) ]
      - name: Ancienne adresse (bandeau de déménagement)
        run: curl -fsS --retry 3 --retry-delay 10 -o /dev/null https://purple-flower-00ac22900.5.azurestaticapps.net/
      - name: API et stockage
        run: |
          BODY=$(curl -fsS --retry 3 --retry-delay 10 https://jlpt.simondepussay.com/api/health)
          echo "$BODY"
          echo "$BODY" | grep -q '"status":"ok"'
